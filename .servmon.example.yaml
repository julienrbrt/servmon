alert_thresholds:
  cpu:
    threshold: 90
    duration: 5m0s
    cooldown: 30m0s
    check_interval: 10s
  memory:
    threshold: 80
    cooldown: 30m0s
    check_interval: 10s
  disks:
    - path: /
      threshold: 90
      cooldown: 4h0m0s
      check_interval: 1m0s
  http:
    url: http://localhost:8080/health
    timeout: 5s
    sample_rate: 10
    failure_threshold: 20
    check_interval: 1m0s
    cooldown: 15m0s
  journalctl:
    enabled: true
    check_interval: 5m0s
    lookback_period: 5m0s
    error_threshold: 10
    priority: err
    cooldown: 30m0s
  reboot:
    enabled: true
    uptime_threshold: 10m0s
email:
  smtp_server: smtp.example.com
  smtp_port: 587
  from: alerts@example.com
  to: admin@example.com
  username: alertuser
  password: alertpassword
